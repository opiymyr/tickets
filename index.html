<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тест по менеджменту</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #1e2a3a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.9rem;
            color: #0f3b5c;
            margin-bottom: 5px;
        }
        .progress-info {
            background: white;
            padding: 12px 20px;
            border-radius: 40px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-weight: bold;
        }
        .question-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .question-header {
            background: #f8fafc;
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e4a6e;
        }
        .question-text {
            padding: 20px 24px 8px 24px;
            font-size: 1.1rem;
            line-height: 1.4;
            font-weight: 500;
            background: white;
        }
        .options {
            padding: 8px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 14px;
            transition: background 0.2s;
            background: #f9f9fc;
            border: 1px solid #e9edf2;
        }
        .option:hover {
            background: #eef2ff;
            border-color: #cbd5e1;
        }
        .option input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option label {
            font-size: 1rem;
            cursor: pointer;
            color: #1e2f3e;
            line-height: 1.4;
        }
        .action-bar {
            position: sticky;
            bottom: 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 12px 24px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
        }
        button {
            background: #2c6e9e;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1f547c;
            transform: scale(0.97);
        }
        .reset-btn {
            background: #5b6e8c;
        }
        .reset-btn:hover {
            background: #3f4e66;
        }
        .results-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .results-card {
            background: white;
            max-width: 750px;
            width: 100%;
            border-radius: 32px;
            padding: 20px 25px 30px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
        }
        .result-item {
            border-left: 5px solid #ccc;
            padding: 12px 15px;
            margin: 15px 0;
            background: #f8f9ff;
            border-radius: 16px;
        }
        .result-correct {
            border-left-color: #2b9348;
            background: #edf7ef;
        }
        .result-wrong {
            border-left-color: #d62828;
            background: #fff5f5;
        }
        .badge-correct {
            background: #2b9348;
            color: white;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 8px;
        }
        .badge-wrong {
            background: #d62828;
            color: white;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 8px;
        }
        .close-modal {
            background: #2c6e9e;
            margin-top: 20px;
            width: 100%;
        }
        .score-big {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        hr {
            margin: 20px 0;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #5a6e7c;
        }
        @media (max-width: 700px) {
            .question-text { font-size: 1rem; }
            .option label { font-size: 0.9rem; }
            .action-bar button { padding: 8px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Тест по менеджменту</h1>
        <div class="progress-info" id="totalQuestions">Загрузка...</div>
    </div>

    <div id="questionsContainer"></div>

    <div class="action-bar">
        <button id="submitBtn">Завершить тест</button>
        <button id="resetBtn" class="reset-btn">Сбросить все</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ALL_QUESTIONS = [
            { "text": "Кем впервые было предложено понятие «функции управления»?", "options": ["А) Ф. Тейлором", "Б) М. Вебером", "В) А. Файолем", "Г) А. Слоаном"], "correct": ["В"] },
            { "text": "В какой период получил развитие системный подход к менеджменту?", "options": ["А) 1920-е гг. — настоящее время", "Б) 1950-е гг. — настоящее время", "В) 1920-е — 1950-е гг.", "Г) 1885 — 1920-е гг."], "correct": ["Б"] },
            { "text": "Что такое менеджмент?", "options": ["А) понятие, являющееся синонимом понятия «бизнес»", "Б) профессиональная деятельность по управлению организациями, обеспечивающая результативность и эффективность их работы", "В) понятие, полностью соответствующее понятию «управление», независимо от природы и особенностей объекта управления", "Г) наука об управлении финансовыми потоками предприятия."], "correct": ["Б"] },
            { "text": "Кто такой менеджер?", "options": ["А) специалист, отвечающий в организации за продажи", "Б) собственник компании", "В) специалист, занятый профессиональной управленческой деятельностью", "Г) администратор, отвечающий за подбор, обучение"], "correct": ["В"] },
            { "text": "Какие должности являются типичными для руководителей высшего звена?", "options": ["А) начальник цеха завода, директор департамента", "Б) начальник отдела эксплуатации, старший продавец", "В) секретарь, кассир, финансовый аналитик", "Г) председатель совета директоров, президент, генеральный директор"], "correct": ["Г"] },
            { "text": "Что является главной отличительной особенностью менеджеров от других сотрудников организации?", "options": ["А) собственного кабинета (офиса)", "Б) властных полномочий", "В) строгого делового стиля одежды", "Г) свободного времени"], "correct": ["Б"] },
            { "text": "Какие особенности лидеров выявляли и описывали теоретики личностного подхода к лидерству?", "options": ["А) манеру поведения и способы принятия решений", "Б) должностные обязанности", "В) качества, навыки и черты характера", "Г) антропометрические характеристики"], "correct": ["В"] },
            { "text": "Что характеризует демократического лидера?", "options": ["А) он старается не навязывать свою волю подчиненным", "Б) он не дает сотрудникам свободы в принятии решений", "В) он использует механизмы влияния, которые апеллируют к потребностям низкого уровня", "Г) он часто применяет методы принуждения"], "correct": ["А"] },
            { "text": "Что показывает диаграмма Гантта?", "options": ["А) на сколько возрастает прибыль предприятия", "Б) в течение какого периода времени должен выполняться каждый пункт плана и как этапы работы связаны между собой", "В) какие количественные характеристики положены в основу показателей работы", "Г) динамику роста доходов предприятия в зависимости от мотивации"], "correct": ["Б"] },
            { "text": "Что является сердцевиной организационной деятельности?", "options": ["А) разработка системы стандартов квалификации", "Б) разработка новых технологий производства", "В) разработка организационной структуры компании", "Г) разработка системы управления документооборотом"], "correct": ["В"] },
            { "text": "Какими полномочиями, как правило, наделяется юридическая служба предприятия?", "options": ["А) линейными", "Б) предостерегающими", "В) рекомендательными", "Г) блокирующими"], "correct": ["Б"] },
            { "text": "Как называются организации, учредители которых обладают правом участия (членства) в них и формируют их высший орган?", "options": ["А) корпоративными", "Б) некоммерческими", "В) унитарными", "Г) государственными"], "correct": ["А"] },
            { "text": "Как называется объединение организаций в единую структуру, в которой продукция одной организации служит сырьем для другой?", "options": ["А) холдингом", "Б) государственным унитарным предприятием", "В) комбинатом", "Г) корпорацией"], "correct": ["В"] },
            { "text": "Как называется организация, владеющая контрольными пакетами акций других компаний с целью осуществления по отношению к ним функций контроля и управления?", "options": ["А) обществом с ограниченной ответственностью", "Б) финансово-промышленной группой", "В) холдингом", "Г) конгломератом"], "correct": ["В"] },
            { "text": "Как называется организация, созданная собственником для осуществления управленческих, социально-культурных или иных функций некоммерческого характера?", "options": ["А) товариществом", "Б) государственным (муниципальным) унитарным предприятием", "В) учреждением", "Г) производственным кооперативом"], "correct": ["В"] },
            { "text": "Что, согласно теории мотивации В. И. Герчикова, характеризует сотрудников с «инструментальным» типом мотивации?", "options": ["А) не стремятся работать и делают лишь то, что приказывает начальник", "Б) стремятся брать на себя полную ответственность", "В) готовы работать с максимальной отдачей на любой работе за высокую оплату", "Г) прежде всего, хотят быть нужными своей организации"], "correct": ["В"] },
            { "text": "Какую оценку результатов деятельности организации подразумевает управленческий контроль?", "options": ["А) субъективную", "Б) количественную и качественную", "В) моральную и материальную", "Г) случайную"], "correct": ["Б"] },
            { "text": "Какие действия руководителей являются целесообразными, когда цель не достигнута из-за ошибочно завышенных требований?", "options": ["А) увольнение виновных сотрудников", "Б) пересмотр первоначальных стандартов", "В) снижение заработной платы менеджеров", "Г) негативное стимулирование угрозами"], "correct": ["Б"] },
            { "text": "Какой вид контроля базируется на измерении фактических результатов очередного этапа работ?", "options": ["А) функциональный", "Б) текущий", "В) заключительный", "Г) итоговый"], "correct": ["Б"] },
            { "text": "Как называется контроль деятельности всей организации в целом?", "options": ["А) выборочным", "Б) наглядным", "В) внешним", "Г) тотальным"], "correct": ["Г"] },
            { "text": "Какими двумя рекомендациями стоит воспользоваться руководителям для повышения производительности труда? (Выберите 2 варианта)", "options": ["А) устранять все лишние движения работников", "Б) поощрять интерес работников к работе", "В) изменить конструкцию инструментов", "Г) привлекать работников к обсуждению нововведений"], "correct": ["Б", "Г"], "multi": true },
            { "text": "Какие две функциональных обязанности относятся к должности менеджера высшего уровня? (Выберите 2 варианта)", "options": ["А) руководит производственно-хозяйственной деятельностью", "Б) обеспечивает исполнение указаний вышестоящего руководства", "В) обеспечивает выполнение обязательств перед бюджетами", "Г) осуществляет координацию сотрудников подразделения"], "correct": ["А", "В"], "multi": true },
            { "text": "Что, в общем случае, понимается под решением?", "options": ["А) сложный аналитический алгоритм, позволяющий с математической точностью оценить потенциальную эффективность какого-либо действия;", "Б) выбор одного варианта действий из ряда возможных;", "В) любая деятельность человека;", "Г) мыслительный процесс, заключающийся в поиске путей получения материальной выгоды."], "correct": ["Б"] },
            { "text": "Как называются управленческие решения, аналогичные решениям, которые принесли успех в сходных ситуациях в прошлом?", "options": ["А) эмпирическими или основанными на суждениях;", "Б) эмпирическими или рациональными;", "В) основанными на суждениях или интуитивными;", "Г) интуитивными или спонтанными."], "correct": ["А"] },
            { "text": "Какое свойство решения обеспечивает соответствие между целями и имеющимися у организации ресурсами?", "options": ["А) реализуемость;", "Б) адаптивность;", "В) своевременность;", "Г) устойчивость"], "correct": ["А"] },
            { "text": "Как называют решение, принимаемое в условиях, когда заранее почти невозможно сделать предположение о каких-либо вариантах действий, а сама ситуация нова и неопределенна?", "options": ["А) многовариантным;", "Б) стандартным;", "В) инновационным;", "Г) бинарным"], "correct": ["В"] },
            { "text": "К формированию какого решения приводит процедура, предполагающая глубокий анализ информации и формирование основанных на нем выводов?", "options": ["А) интуитивного решения;", "Б) рационального решения;", "В) бинарного решения;", "Г) решения, основанного на суждениях."], "correct": ["Б"] },
            { "text": "Какой фактор, помимо информационного, играет важную роль в коммуникациях?", "options": ["А) технический;", "Б) личностный;", "В) экономический;", "Г) тактический"], "correct": ["Б"] },
            { "text": "Какой приблизительный процент рабочего времени менеджеров высшего звена, по данным исследований, занят общением?", "options": ["А) 25 %;", "Б) 100 %;", "В) 90 %;", "Г) 70 %"], "correct": ["В"] },
            { "text": "Как называется перемещение информации между уровнями управления организации, а также между менеджментом и исполнителями?", "options": ["А) вертикальной коммуникацией;", "Б) горизонтальной коммуникацией;", "В) диагональной коммуникацией;", "Г) обратной коммуникацией"], "correct": ["А"] },
            { "text": "Как называются система общепринятых в организации ценностей, традиций, стандартов поведения и форм отношений, которые отличают данную организацию от других?", "options": ["А) миссия организации;", "Б) организационная структура;", "В) организационная культура;", "Г) видение организации"], "correct": ["В"] },
            { "text": "Как называется искусственно созданный объект, имеющий знаковое или символическое содержание в организационной культуре?", "options": ["А) артефакт;", "Б) ритуал;", "В) традиция;", "Г) поведение"], "correct": ["А"] },
            { "text": "Какова часто встречающаяся особенность управления организационными изменениями?", "options": ["А) отсутствие сопротивления со стороны сотрудников; позитивные перемены на начальных стадиях;", "Б) сопротивление со стороны части сотрудников; отсутствие позитивных перемен на начальных стадиях;", "В) отсутствие сопротивления со стороны сотрудников; отсутствие позитивных перемен на начальных стадиях;", "Г) сопротивление со стороны части сотрудников; позитивные перемены на начальных стадиях"], "correct": ["Б"] },
            { "text": "Посредством чего на начальном этапе развивается организация в соответствии с модели жизненного цикла организации Л. Грейнера?", "options": ["А) координации", "Б) делегирования полномочий", "В) сотрудничества", "Г) созидания"], "correct": ["Г"] },
            { "text": "Какая стадия в модели жизненного цикла организации И. Адизеса является последней, предшествующей дальнейшему спаду?", "options": ["А) юности", "Б) давай-давай", "В) стабильности", "Г) расцвета"], "correct": ["В"] },
            { "text": "Как называется целенаправленная деятельность менеджмента по качественному совершенствованию средств и способов достижения новых целей организации?", "options": ["А) организационное планирование", "Б) организационное проектирование", "В) организационное развитие", "Г) организационное снабжение"], "correct": ["В"] },
            { "text": "Как называется процесс формирования новой организационной системы, обеспечивающей максимальную результативность и эффективность достижения целей организационного развития?", "options": ["А) организационные результаты", "Б) организационные ресурсы", "В) организационные способности", "Г) организационные изменения"], "correct": ["Г"] },
            { "text": "Как называется в модели К. Левина уточнение и закрепление новой организационной практики, недопущение возврата к прежним методам работы?", "options": ["А) размораживанием", "Б) движением", "В) замораживанием", "Г) окончанием"], "correct": ["В"] },
            { "text": "Как называются спонтанные организационные изменения, осуществляемые без заранее определенных общесистемных целей, изменения в технологии, в товарах и услугах, в стратегии, в организационной культуре?", "options": ["А) незапланированными", "Б) запланированными", "В) эволюционными", "Г) революционными"], "correct": ["А"] },

            { "text": "Какие три события происходят на стадии «Юность» по И. Адизесу? (Выберите 3 варианта)", "options": ["А) управление не формализовано", "Б) широкое делегирование полномочий", "В) переход к профессиональному менеджменту", "Г) переориентация целей («работать умнее»)"], "correct": ["Б", "В", "Г"], "multi": true },
            { "text": "Какие три вида деятельности входят в планирование изменений? (Выберите 3 варианта)", "options": ["А) выбор базовой модели", "Б) проведение пробных изменений", "В) оценка периода реализации", "Г) проектирование параметров"], "correct": ["А", "В", "Г"], "multi": true },
            { "text": "Какие три причины увеличивают продолжительность жизненного цикла организации? (Выберите 3 варианта)", "options": ["А) способность сформировать новую бизнес-идею", "Б) нежелание делиться властью", "В) сохранение семейных традиций", "Г) благоприятные рыночные условия"], "correct": ["А", "В", "Г"], "multi": true },
            { "text": "Какие два направления изменения организационной культуры используют организации? (Выберите 2 варианта)", "options": ["А) изменение системы отчетности", "Б) изменение оргструктуры", "В) изменение поведения сотрудников", "Г) изменение коммуникаций"], "correct": ["В", "Г"], "multi": true },
            { "text": "Какие три возможности получает организация, использующая модель жизненного цикла? (Выберите 3 варианта)", "options": ["А) жестко следовать этапам", "Б) анализировать проблемы", "В) пользоваться рекомендациями по преодолению кризисов", "Г) принимать своевременные меры"], "correct": ["Б", "В", "Г"], "multi": true }
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let currentQuestions = shuffleArray([...ALL_QUESTIONS]);

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            const totalSpan = document.getElementById('totalQuestions');
            totalSpan.textContent = `Всего вопросов: ${currentQuestions.length}`;
            
            let html = '';
            currentQuestions.forEach((q, idx) => {
                const questionNum = idx + 1;
                html += `
                    <div class="question-card" data-qidx="${idx}">
                        <div class="question-header">Вопрос ${questionNum}</div>
                        <div class="question-text">${q.text}</div>
                        <div class="options">
                `;
                q.options.forEach((opt, optIdx) => {
                    const inputType = q.multi ? 'checkbox' : 'radio';
                    const nameAttr = q.multi ? `q${idx}_${optIdx}` : `q${idx}`;
                    html += `
                        <div class="option">
                            <input type="${inputType}" name="${nameAttr}" value="${opt[0]}" id="q${idx}_${optIdx}">
                            <label for="q${idx}_${optIdx}">${opt}</label>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function collectAnswers() {
            const answers = {};
            currentQuestions.forEach((_, idx) => {
                const card = document.querySelector(`.question-card[data-qidx="${idx}"]`);
                if (!card) return;
                
                const selected = [];
                const radios = card.querySelectorAll('input[type="radio"]:checked');
                const checkboxes = card.querySelectorAll('input[type="checkbox"]:checked');
                
                if (radios.length) {
                    selected.push(radios[0].value);
                } else if (checkboxes.length) {
                    checkboxes.forEach(cb => selected.push(cb.value));
                }
                answers[idx] = selected;
            });
            return answers;
        }

        function resetAnswers() {
            document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
                input.checked = false;
            });
        }

        function checkTest() {
            const answers = collectAnswers();
            let score = 0;
            const results = [];
            
            currentQuestions.forEach((q, idx) => {
                const correctSet = new Set(q.correct);
                const userSet = new Set(answers[idx] || []);
                const isCorrect = correctSet.size === userSet.size && 
                                [...correctSet].every(v => userSet.has(v));
                if (isCorrect) score++;
                
                results.push({
                    text: q.text,
                    userChoice: answers[idx] || [],
                    correct: q.correct,
                    isCorrect: isCorrect
                });
            });
            
            const percentage = Math.round((score / currentQuestions.length) * 100);
            showResults(score, currentQuestions.length, percentage, results);
        }

        function showResults(score, total, percentage, results) {
            const modal = document.createElement('div');
            modal.className = 'results-modal';
            
            let html = `
                <div class="results-card">
                    <h2 style="text-align:center">Результат тестирования</h2>
                    <div class="score-big">${score} / ${total}</div>
                    <div style="text-align:center">${percentage}% правильных ответов</div>
                    <hr>
                    <h3>Детальный разбор:</h3>
            `;
            
            results.forEach((res, idx) => {
                const statusClass = res.isCorrect ? 'result-correct' : 'result-wrong';
                const badge = res.isCorrect ? 
                    '<span class="badge-correct">✓ Верно</span>' : 
                    '<span class="badge-wrong">✗ Неверно</span>';
                const userText = res.userChoice.length ? res.userChoice.join(', ') : '— нет ответа —';
                
                html += `
                    <div class="result-item ${statusClass}">
                        ${badge}
                        <div><strong>${idx+1}. ${res.text}</strong></div>
                        <div style="margin-top:8px">Правильный ответ: ${res.correct.join(', ')}</div>
                        <div>Ваш ответ: ${userText}</div>
                    </div>
                `;
            });
            
            html += `<button id="closeModal" style="background:#2c6e9e; border:none; color:white; font-weight:bold; font-size:1rem; padding:12px 28px; border-radius:40px; cursor:pointer; width:100%; margin-top:20px;">Закрыть</button></div>`;
            modal.innerHTML = html;
            document.body.appendChild(modal);
            
            document.getElementById('closeModal').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        // Запуск
        renderQuestions();
        
        document.getElementById('submitBtn').onclick = () => checkTest();
        document.getElementById('resetBtn').onclick = () => {
            if (confirm('Сбросить все выбранные ответы?')) {
                resetAnswers();
            }
        };
    });
</script>
</body>
</html>
